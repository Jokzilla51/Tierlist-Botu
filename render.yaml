services:
  - type: web
    name: minecraft-tierlist-discord-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATA_FILE
        value: ./data/state.json
      - key: ENABLE_PRESENCE_INTENT
        value: "false"
      - key: READY_TIMEOUT_MINUTES
        value: "5"
      - key: NO_SHOW_RETRY_MINUTES
        value: "15"

